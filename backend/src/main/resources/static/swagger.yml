openapi: 3.0.3
info:
  title: Prepare for TELC API
  version: 1.0.0
  description: |
    Comprehensive REST API specification for the **Prepare-for-TELC** German language exam platform.
    Built with Spring Boot 3.4 on Java 25 following Domain-Driven Design (DDD) principles.
    Provides stateless JWT authentication, question banking across levels A1-C1 and modules (Lesen, Sprachbausteine, Hören),
    exam template composition, student assignment dispatching, and automated diagnostic scoring (≥ 60% pass threshold).
  contact:
    name: TELC Examination Platform Team
    email: support@preparefortelc.com
servers:
  - url: http://localhost:8080
    description: Local Development Server
  - url: https://prepare-for-telc-api.onrender.com
    description: Production Render Web Service

tags:
  - name: Authentication
    description: Identity & Access Management (Stateless JWT)
  - name: Question Bank
    description: Standardized question curation categorized by level (A1-C1) and module
  - name: Exam Blueprints
    description: Exam template composition and blueprint management
  - name: Exam Assignments
    description: Exam dispatch engine assigning tests to candidates with expiration windows
  - name: Grading & Results
    description: Automated MCQ checking engine, score calculation, and diagnostic review

paths:
  # =========================================================================
  # 1. Authentication Endpoints
  # =========================================================================
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new candidate or teacher account
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Registration successful, returns JWT bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request payload or email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate with email and password
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Authentication successful, returns JWT bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Bad credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/me:
    get:
      tags:
        - Authentication
      summary: Retrieve current authenticated user profile
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized token

  # =========================================================================
  # 2. Question Bank Endpoints
  # =========================================================================
  /api/questions:
    get:
      tags:
        - Question Bank
      summary: List question repository items (filtered by level/module)
      operationId: getQuestions
      security:
        - BearerAuth: []
      parameters:
        - name: level
          in: query
          required: false
          description: Filter by CEFR Level
          schema:
            $ref: '#/components/schemas/ExamLevel'
        - name: module
          in: query
          required: false
          description: Filter by TELC Exam Module
          schema:
            $ref: '#/components/schemas/ExamModule'
      responses:
        '200':
          description: List of matching questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Question'
    post:
      tags:
        - Question Bank
      summary: Create a new question item
      description: Restricted to users with ROLE_TEACHER or ROLE_ADMIN
      operationId: createQuestion
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionRequest'
      responses:
        '201':
          description: Question created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '400':
          description: Validation error
        '403':
          description: Access forbidden (insufficient privileges)

  /api/questions/{id}:
    get:
      tags:
        - Question Bank
      summary: Retrieve question item by ID
      operationId: getQuestionById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Question details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '404':
          description: Question not found
    put:
      tags:
        - Question Bank
      summary: Update existing question item
      description: Restricted to users with ROLE_TEACHER or ROLE_ADMIN
      operationId: updateQuestion
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionRequest'
      responses:
        '200':
          description: Question updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '404':
          description: Question not found
    delete:
      tags:
        - Question Bank
      summary: Delete question item by ID
      description: Restricted to users with ROLE_TEACHER or ROLE_ADMIN
      operationId: deleteQuestion
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Question deleted successfully
        '404':
          description: Question not found

  # =========================================================================
  # 3. Exam Blueprint Endpoints
  # =========================================================================
  /api/exams:
    get:
      tags:
        - Exam Blueprints
      summary: List exam templates
      operationId: getExams
      security:
        - BearerAuth: []
      parameters:
        - name: level
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ExamLevel'
      responses:
        '200':
          description: List of available exam templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Exam'
    post:
      tags:
        - Exam Blueprints
      summary: Assemble and create a new exam blueprint
      description: Restricted to users with ROLE_TEACHER or ROLE_ADMIN
      operationId: createExam
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExamRequest'
      responses:
        '201':
          description: Exam blueprint created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exam'
        '400':
          description: Invalid blueprint parameters

  /api/exams/{id}:
    get:
      tags:
        - Exam Blueprints
      summary: Retrieve exam blueprint by ID
      operationId: getExamById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Exam blueprint details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exam'
        '404':
          description: Exam not found

  # =========================================================================
  # 4. Exam Assignment Endpoints
  # =========================================================================
  /api/assignments/dispatch:
    post:
      tags:
        - Exam Assignments
      summary: Dispatch exam assignment to a candidate email
      description: Restricted to users with ROLE_TEACHER or ROLE_ADMIN
      operationId: dispatchExam
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
      responses:
        '201':
          description: Exam successfully dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamAssignment'
        '404':
          description: Candidate or Exam not found

  /api/assignments/student:
    get:
      tags:
        - Exam Assignments
      summary: Retrieve all assignments for current logged-in candidate
      operationId: getStudentAssignments
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Candidate assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExamAssignment'

  /api/assignments/teacher:
    get:
      tags:
        - Exam Assignments
      summary: Retrieve all dispatched assignments (Teacher view)
      description: Restricted to users with ROLE_TEACHER or ROLE_ADMIN
      operationId: getTeacherAssignments
      security:
        - BearerAuth: []
      responses:
        '200':
          description: All dispatched assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExamAssignment'

  /api/assignments/{id}:
    get:
      tags:
        - Exam Assignments
      summary: Retrieve assignment details
      operationId: getAssignmentById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Assignment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamAssignment'
        '404':
          description: Assignment not found

  /api/assignments/{id}/start:
    post:
      tags:
        - Exam Assignments
      summary: Mark assignment status as IN_PROGRESS
      operationId: startExam
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Assignment status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamAssignment'

  # =========================================================================
  # 5. Grading & Results Endpoints
  # =========================================================================
  /api/assignments/{id}/submit:
    post:
      tags:
        - Grading & Results
      summary: Submit candidate answers and trigger auto-grading engine
      description: |
        Grades candidate MCQ answers against question keys, computes section scores
        for Lesen, Sprachbausteine, and Hören, determines Pass/Fail status (≥ 60%),
        and returns an itemized diagnostic breakdown.
      operationId: submitExam
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionRequest'
      responses:
        '200':
          description: Graded exam result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamResultResponse'
        '403':
          description: Unauthorized to submit for this assignment
        '404':
          description: Assignment not found

  /api/results/assignment/{assignmentId}:
    get:
      tags:
        - Grading & Results
      summary: Retrieve graded result breakdown for an assignment
      operationId: getResultByAssignment
      security:
        - BearerAuth: []
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Result breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamResultResponse'
        '404':
          description: Result not found

  /api/results/student:
    get:
      tags:
        - Grading & Results
      summary: Retrieve result history for current candidate
      operationId: getStudentResults
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Candidate past results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExamResultResponse'

  /api/results/all:
    get:
      tags:
        - Grading & Results
      summary: Retrieve all graded submissions (Teacher overview)
      description: Restricted to users with ROLE_TEACHER or ROLE_ADMIN
      operationId: getAllResults
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of all submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExamResultResponse'

# =========================================================================
# Schemas & Components
# =========================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Provide JWT token prefixed by `Bearer `

  schemas:
    Role:
      type: string
      enum:
        - ROLE_STUDENT
        - ROLE_TEACHER
        - ROLE_ADMIN

    ExamLevel:
      type: string
      enum:
        - A1
        - A2
        - B1
        - B2
        - C1
      example: B2

    ExamModule:
      type: string
      enum:
        - LESEN
        - SPRACHBAUSTEINE
        - HOEREN
      example: LESEN

    AssignmentStatus:
      type: string
      enum:
        - PENDING
        - IN_PROGRESS
        - COMPLETED
        - EXPIRED
      example: PENDING

    AuthRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: student@telc.com
        password:
          type: string
          format: password
          example: Password123!

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - name
        - role
      properties:
        email:
          type: string
          format: email
          example: candidate@example.com
        password:
          type: string
          format: password
          minLength: 6
          example: SecretPass123!
        name:
          type: string
          example: Alex Mustermann
        role:
          $ref: '#/components/schemas/Role'

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type:
          type: string
          example: Bearer
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          example: student@telc.com
        name:
          type: string
          example: Alex Mustermann
        role:
          $ref: '#/components/schemas/Role'

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          example: student@telc.com
        name:
          type: string
          example: Alex Mustermann
        role:
          $ref: '#/components/schemas/Role'

    QuestionRequest:
      type: object
      required:
        - title
        - questionText
        - level
        - module
        - options
        - correctAnswer
      properties:
        title:
          type: string
          example: "Leseverstehen Teil 1: Flexible Arbeitsmodelle"
        passage:
          type: string
          example: "Die Digitalisierung hat in den letzten Jahren die deutsche Arbeitswelt verändert..."
        questionText:
          type: string
          example: "Welche Auswirkung flexibler Modelle wird im Text hervorgehoben?"
        level:
          $ref: '#/components/schemas/ExamLevel'
        module:
          $ref: '#/components/schemas/ExamModule'
        audioUrl:
          type: string
          example: "https://actions.google.com/sounds/v1/ambiences/outdoor_market.ogg"
        maxAudioPlays:
          type: integer
          default: 2
          example: 2
        options:
          type: array
          items:
            type: string
          example:
            - "A) Sie führen zu sinkender Zufriedenheit."
            - "B) Sie erhöhen nachweislich Produktivität und Zufriedenheit."
            - "C) Sie verringern die Autonomie."
            - "D) Sie werden abgelehnt."
        correctAnswer:
          type: string
          example: "B"
        explanation:
          type: string
          example: "Der Text nennt ausdrücklich die Steigerung der Produktivität bei klaren Regeln."
        points:
          type: integer
          default: 5
          example: 10

    Question:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 101
        title:
          type: string
        passage:
          type: string
        questionText:
          type: string
        level:
          $ref: '#/components/schemas/ExamLevel'
        module:
          $ref: '#/components/schemas/ExamModule'
        audioUrl:
          type: string
        maxAudioPlays:
          type: integer
        options:
          type: array
          items:
            type: string
        correctAnswer:
          type: string
        explanation:
          type: string
        points:
          type: integer

    ExamRequest:
      type: object
      required:
        - title
        - level
        - questionIds
      properties:
        title:
          type: string
          example: "TELC Deutsch B2 - Offizieller Modelltest 1"
        description:
          type: string
          example: "Modelltest umfassend Lesen, Sprachbausteine und Hören."
        level:
          $ref: '#/components/schemas/ExamLevel'
        durationMinutes:
          type: integer
          default: 90
          example: 90
        passingPercentage:
          type: number
          format: double
          default: 60.0
          example: 60.0
        questionIds:
          type: array
          items:
            type: integer
            format: int64
          example: [1, 2, 3, 4, 5, 6, 7]

    Exam:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
        description:
          type: string
        level:
          $ref: '#/components/schemas/ExamLevel'
        durationMinutes:
          type: integer
        passingPercentage:
          type: number
          format: double
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
        createdAt:
          type: string
          format: date-time

    AssignmentRequest:
      type: object
      required:
        - studentEmail
        - examId
      properties:
        studentEmail:
          type: string
          format: email
          example: student@telc.com
        examId:
          type: integer
          format: int64
          example: 1
        expiresInDays:
          type: integer
          default: 7
          example: 7

    ExamAssignment:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        student:
          $ref: '#/components/schemas/UserResponse'
        exam:
          $ref: '#/components/schemas/Exam'
        assignedBy:
          $ref: '#/components/schemas/UserResponse'
        assignedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/AssignmentStatus'

    SubmissionRequest:
      type: object
      required:
        - answers
      properties:
        answers:
          type: object
          additionalProperties:
            type: string
          description: Mapping of questionId to chosen option letter (e.g. "1": "B")
          example:
            "1": "B"
            "2": "B"
            "3": "A"
            "4": "A"
            "5": "B"
            "6": "A"
            "7": "B"

    SectionScoreDto:
      type: object
      properties:
        score:
          type: integer
          example: 20
        maxScore:
          type: integer
          example: 20
        percentage:
          type: number
          format: double
          example: 100.0

    QuestionReviewDto:
      type: object
      properties:
        questionId:
          type: integer
          format: int64
        title:
          type: string
        passage:
          type: string
        questionText:
          type: string
        module:
          $ref: '#/components/schemas/ExamModule'
        options:
          type: array
          items:
            type: string
        chosenAnswer:
          type: string
          example: "B"
        correctAnswer:
          type: string
          example: "B"
        correct:
          type: boolean
          example: true
        pointsEarned:
          type: integer
          example: 10
        maxPoints:
          type: integer
          example: 10
        explanation:
          type: string

    ExamResultResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 50
        assignmentId:
          type: integer
          format: int64
          example: 10
        examId:
          type: integer
          format: int64
          example: 1
        examTitle:
          type: string
          example: "TELC Deutsch B2 - Offizieller Modelltest 1"
        examLevel:
          $ref: '#/components/schemas/ExamLevel'
        studentEmail:
          type: string
          example: student@telc.com
        studentName:
          type: string
          example: Alex Mustermann
        totalScore:
          type: integer
          example: 55
        maxScore:
          type: integer
          example: 55
        percentage:
          type: number
          format: double
          example: 100.0
        passed:
          type: boolean
          description: Indicates whether candidate achieved ≥ 60%
          example: true
        submittedAt:
          type: string
          format: date-time
        sectionScores:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SectionScoreDto'
        questionsReview:
          type: array
          items:
            $ref: '#/components/schemas/QuestionReviewDto'

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          example: 400
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "Email is already registered"
        path:
          type: string
          example: "/api/auth/register"
