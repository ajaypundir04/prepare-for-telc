version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: prepare-for-telc-db
    environment:
      POSTGRES_DB: prepare_for_telc_production
      POSTGRES_USER: telc_admin
      POSTGRES_PASSWORD: telc_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telc_admin -d prepare_for_telc_production"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prepare-for-telc-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/prepare_for_telc_production
      SPRING_DATASOURCE_USERNAME: telc_admin
      SPRING_DATASOURCE_PASSWORD: telc_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: dGVsYy1leGFtLXByZXBhcmF0aW9uLXN1cGVyLXNlY3JldC1qd3Qta2V5LTIwMjYtbW9ub3JlcG8tc3lzdGVt
      PORT: 8080
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prepare-for-telc-web
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  postgres_data:
